name: Release

# HACS offers each published GitHub release to the users who added this repository. The workflow
# only checks the release, because HACS downloads the tagged source itself.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag and the commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/alacart/manifest.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match the version $version in manifest.json." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $TAG points at a commit that is not on main." >&2
            exit 1
          fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
